version: '3.8'

services:
  backend:
    build: .
    container_name: educonnect-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET
      - JWT_REFRESH_SECRET
    volumes:
      # Persistent storage for SQLite database and uploaded media files
      - ./educonnect.db:/app/educonnect.db
      - ./uploads:/app/uploads
